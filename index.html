<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <img src="/images/icon1.jpg" alt='1'>

  <div class="bottom">
    <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
    <div class="icons">
      <i class="fa-solid fa-3x fa-backward-step" id="previous"></i>
      <i  class="far fa-3x fa-circle-play" id="masterplay"></i>
      <i  class="fa-solid fa-3x fa-forward-step" id="next"></i>

    <div class="songInfo">
      <img src="images\play.gif" width="42px" alt="" id="gif"><span id="masterSongName">Perfect</span>
